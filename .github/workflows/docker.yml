name: docker
on:
  workflow_call:
    inputs:
      image:
        type: string
        description: image name, defaults to ghcr.io/<owner>/<repo>
        default: ""
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      push:
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: meta
        name: work out tags
        run: |
          image="${{ inputs.image }}"
          [ -z "$image" ] && image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(cat VERSION 2>/dev/null || echo 0.0.0)
          branch="${GITHUB_REF_NAME//\//-}"
          tags="${image}:${branch}-${version},${image}:sha-${GITHUB_SHA::8}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags="${image}:${GITHUB_REF_NAME},${image}:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
