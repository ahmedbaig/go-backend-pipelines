variables:
  GO_IMAGE: golang:1.27-alpine
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKERFILE: Dockerfile
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -buildvcs=false
  COVERAGE_MIN: "0"

stages:
  - lint
  - test
  - build
  - release

.go:
  image: $GO_IMAGE
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod]
  before_script:
    - apk add --no-cache git build-base >/dev/null

.go-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

go:lint:
  extends: [.go, .go-rules]
  stage: lint
  script:
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
    - go vet ./...
    - go run honnef.co/go/tools/cmd/staticcheck@latest ./...

go:test:
  extends: [.go, .go-rules]
  stage: test
  script:
    - CONFIG_DIR=$(mktemp -d) CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
    - total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
    - awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t+0 < m+0) }'
    - go run github.com/boumenot/gocover-cobertura@latest < coverage.out > coverage.xml
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

go:vulncheck:
  extends: .go
  stage: test
  allow_failure: true
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.docker:
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

docker:branch:
  extends: .docker
  stage: build
  script:
    - VERSION=$(cat VERSION 2>/dev/null || echo 0.0.0)
    - TAG="${CI_COMMIT_REF_SLUG}-${VERSION}"
    - docker build -f "$DOCKERFILE" -t "$DOCKER_IMAGE_NAME:$TAG" -t "$DOCKER_IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA" .
    - docker push "$DOCKER_IMAGE_NAME:$TAG"
    - docker push "$DOCKER_IMAGE_NAME:sha-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH && $DOCKER_DISABLED != "true"
      exists: [Dockerfile]

docker:release:
  extends: .docker
  stage: release
  script:
    - docker build -f "$DOCKERFILE" -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_TAG" -t "$DOCKER_IMAGE_NAME:latest" .
    - docker push "$DOCKER_IMAGE_NAME:$CI_COMMIT_TAG"
    - docker push "$DOCKER_IMAGE_NAME:latest"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $DOCKER_DISABLED != "true"
      exists: [Dockerfile]
